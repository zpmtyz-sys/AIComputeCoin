syntax = "proto3";

package computecoin.v1;

option go_package = "github.com/zpmtyz-sys/AIComputeCoin/proto/computecoin/v1";

// Represents a unit of compute power measurement
message ComputeUnit {
  string id = 1;
  double tflops = 2;
  uint32 duration_hours = 3;
  string fp_precision = 4;
  // Unix timestamp in milliseconds
  int64 measured_at = 5;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
  ORDER_TYPE_STOP_LIMIT = 3;
  ORDER_TYPE_IOC = 4;
  ORDER_TYPE_FOK = 5;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_NEW = 1;
  ORDER_STATUS_PARTIALLY_FILLED = 2;
  ORDER_STATUS_FILLED = 3;
  ORDER_STATUS_CANCELLED = 4;
  ORDER_STATUS_REJECTED = 5;
}

message Order {
  string id = 1;
  string user_id = 2;
  string pair = 3;
  Side side = 4;
  OrderType order_type = 5;
  string price = 6;
  string quantity = 7;
  string filled_quantity = 8;
  OrderStatus status = 9;
  // Unix timestamp in milliseconds
  int64 created_at = 10;
  int64 updated_at = 11;
}

message Trade {
  string id = 1;
  string order_id = 2;
  string maker_order_id = 3;
  string taker_order_id = 4;
  string pair = 5;
  string price = 6;
  string quantity = 7;
  Side side = 8;
  // Unix timestamp in milliseconds
  int64 traded_at = 9;
}

message OracleReport {
  string node_id = 1;
  string gpu_id = 2;
  double cu_measured = 3;
  double confidence_score = 4;
  string hardware_hash = 5;
  repeated string benchmark_results = 6;
  // Unix timestamp in milliseconds
  int64 timestamp = 7;
}

// Request/Response messages for MatchingService
message SubmitOrderRequest {
  Order order = 1;
}

message SubmitOrderResponse {
  Order order = 1;
  repeated Trade trades = 2;
}

message CancelOrderRequest {
  string order_id = 1;
  string user_id = 2;
}

message CancelOrderResponse {
  Order order = 1;
}

message GetOrderBookRequest {
  string pair = 1;
  uint32 depth = 2;
}

message PriceLevel {
  string price = 1;
  string quantity = 2;
  uint32 order_count = 3;
}

message GetOrderBookResponse {
  string pair = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
  uint64 sequence_id = 4;
}

// Request/Response messages for GetTrades
message GetTradesRequest {
  string pair = 1;
  uint32 limit = 2;
}

message GetTradesResponse {
  repeated Trade trades = 1;
}

// Request message for SubscribeTrades
message SubscribeTradesRequest {
  string pair = 1;
}

// Matching engine gRPC service
service MatchingService {
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse);
  rpc GetTrades(GetTradesRequest) returns (GetTradesResponse);
  rpc SubscribeOrderBook(GetOrderBookRequest) returns (stream GetOrderBookResponse);
  rpc SubscribeTrades(SubscribeTradesRequest) returns (stream Trade);
}
