syntax = "proto3";

package computecoin.market.v1;

option go_package = "github.com/zpmtyz-sys/AIComputeCoin/proto/computecoin/market/v1";

message PriceLevel {
  string price = 1;
  string quantity = 2;
  uint32 order_count = 3;
}

message OrderBookSnapshot {
  string pair = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
  uint64 sequence_id = 4;
  // Unix timestamp in milliseconds
  int64 timestamp = 5;
}

message OrderBookDelta {
  string pair = 1;
  repeated PriceLevel bids = 2;
  repeated PriceLevel asks = 3;
  uint64 sequence_id = 4;
}

message Kline {
  string pair = 1;
  string interval = 2;
  string open = 3;
  string high = 4;
  string low = 5;
  string close = 6;
  string volume = 7;
  // Unix timestamp in milliseconds
  int64 open_time = 8;
  int64 close_time = 9;
}

message Ticker {
  string pair = 1;
  string last_price = 2;
  string bid = 3;
  string ask = 4;
  string high_24h = 5;
  string low_24h = 6;
  string volume_24h = 7;
  string change_24h_percent = 8;
}

message TradeEvent {
  string trade_id = 1;
  string pair = 2;
  string price = 3;
  string quantity = 4;
  string side = 5;
  // Unix timestamp in milliseconds
  int64 timestamp = 6;
}

// Request/Response messages for MarketDataService
message GetOrderBookRequest {
  string pair = 1;
  uint32 depth = 2;
}

message GetKlinesRequest {
  string pair = 1;
  string interval = 2;
  int64 start_time = 3;
  int64 end_time = 4;
  uint32 limit = 5;
}

message GetKlinesResponse {
  repeated Kline klines = 1;
}

message StreamTradesRequest {
  string pair = 1;
}

message StreamOrderBookRequest {
  string pair = 1;
}

// Market data gRPC service
service MarketDataService {
  rpc GetOrderBook(GetOrderBookRequest) returns (OrderBookSnapshot);
  rpc GetKlines(GetKlinesRequest) returns (GetKlinesResponse);
  rpc StreamTrades(StreamTradesRequest) returns (stream TradeEvent);
  rpc StreamOrderBook(StreamOrderBookRequest) returns (stream OrderBookDelta);
}
