[package]
name = "computecoin-matching-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance order matching engine for ComputeCoin"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"

[[bench]]
name = "matching"
harness = false
