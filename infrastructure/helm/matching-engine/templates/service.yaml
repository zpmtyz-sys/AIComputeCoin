apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-matching-engine
  labels:
    app: matching-engine
    app.kubernetes.io/name: matching-engine
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: {{ .Values.service.protocol }}
      name: grpc
  selector:
    app: matching-engine
    app.kubernetes.io/instance: {{ .Release.Name }}
