---
# Default deny all ingress and egress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: computecoin
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow DNS resolution for all pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: computecoin
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Allow ingress controller to reach api-gateway and web-app
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-public-services
  namespace: computecoin
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - api-gateway
          - web-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx

---
# Allow api-gateway to reach internal services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway-to-services
  namespace: computecoin
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: matching-engine
      ports:
        - protocol: TCP
          port: 50051
    - to:
        - podSelector:
            matchLabels:
              app: trading-service
      ports:
        - protocol: TCP
          port: 50052
    - to:
        - podSelector:
            matchLabels:
              app: oracle-service
      ports:
        - protocol: TCP
          port: 50053
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 29092

---
# Allow trading-service to reach its dependencies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-trading-service-egress
  namespace: computecoin
spec:
  podSelector:
    matchLabels:
      app: trading-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 29092
    - to:
        - podSelector:
            matchLabels:
              app: matching-engine
      ports:
        - protocol: TCP
          port: 50051

---
# Allow oracle-service to reach blockchain
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oracle-to-blockchain
  namespace: computecoin
spec:
  podSelector:
    matchLabels:
      app: oracle-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: blockchain
      ports:
        - protocol: TCP
          port: 26657

---
# Allow blockchain P2P communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-blockchain-p2p
  namespace: computecoin
spec:
  podSelector:
    matchLabels:
      app: blockchain
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: blockchain
      ports:
        - protocol: TCP
          port: 26656
    - from:
        - podSelector:
            matchLabels:
              app: oracle-service
      ports:
        - protocol: TCP
          port: 26657
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: blockchain
      ports:
        - protocol: TCP
          port: 26656

---
# Allow Prometheus to scrape all services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: computecoin
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 50052
        - protocol: TCP
          port: 50053
        - protocol: TCP
          port: 26657
