apiVersion: v1
kind: ResourceQuota
metadata:
  name: computecoin-quota
  namespace: computecoin
  labels:
    app.kubernetes.io/part-of: computecoin-platform
spec:
  hard:
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"
    pods: "100"
    persistentvolumeclaims: "20"
    services: "20"
    secrets: "50"
    configmaps: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: computecoin-limit-range
  namespace: computecoin
  labels:
    app.kubernetes.io/part-of: computecoin-platform
spec:
  limits:
    - default:
        cpu: "1000m"
        memory: "1Gi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "4000m"
        memory: "8Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
      type: Container
