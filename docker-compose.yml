version: "3.8"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-computecoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-computecoin_dev}
      POSTGRES_DB: ${POSTGRES_DB:-computecoin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - computecoin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U computecoin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - computecoin-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - computecoin-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  matching-engine:
    build:
      context: .
      dockerfile: packages/matching-engine/Dockerfile
    ports:
      - "50051:50051"
    environment:
      RUST_LOG: info
    networks:
      - computecoin-network

  api-gateway:
    build:
      context: ./packages/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-computecoin}:${POSTGRES_PASSWORD:-computecoin_dev}@postgres:5432/${POSTGRES_DB:-computecoin}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      MATCHING_ENGINE_URL: http://matching-engine:50051
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - computecoin-network

  trading-service:
    build:
      context: ./packages/trading-service
      dockerfile: Dockerfile
    ports:
      - "50052:50052"
    environment:
      PORT: "50052"
      DATABASE_URL: postgresql://${POSTGRES_USER:-computecoin}:${POSTGRES_PASSWORD:-computecoin_dev}@postgres:5432/${POSTGRES_DB:-computecoin}
      KAFKA_BROKERS: kafka:29092
      MATCHING_ENGINE_URL: matching-engine:50051
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - computecoin-network

  oracle-service:
    build:
      context: ./packages/oracle-service
      dockerfile: Dockerfile
    ports:
      - "50053:50053"
    environment:
      PORT: "50053"
      CHAIN_RPC_URL: http://blockchain:26657
    networks:
      - computecoin-network

  blockchain:
    build:
      context: .
      dockerfile: packages/blockchain/Dockerfile
    ports:
      - "26657:26657"
      - "26656:26656"
    environment:
      RUST_LOG: info
      CHAIN_ID: computecoin-testnet-1
    networks:
      - computecoin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:26657/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-app:
    build:
      context: ./packages/web-app
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:3000
      NEXT_PUBLIC_WS_URL: ws://api-gateway:3000/ws
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - computecoin-network

  prometheus:
    image: prom/prometheus:v2.50.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - computecoin-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - computecoin-network

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:

networks:
  computecoin-network:
    driver: bridge
